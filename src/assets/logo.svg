<svg width="200" height="100" viewBox="5 35 190 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Heart rate / intensity pulse line.

       Drawn in currentColor: the redesign forbids gradients and blur, and the
       six stops this used to carry were the old zone colours, which no longer
       exist. Following the ink means the mark reads correctly on cream and on
       the dark theme, and share templates get it in their own foreground
       colour instead of a palette that fights theirs. -->
  <path d="M 10 100 L 30 100 L 35 110 L 45 70 L 55 130 L 65 50 L 75 120 L 85 40 L 95 100 L 115 100 L 120 110 L 130 70 L 140 130 L 150 50 L 160 120 L 170 40 L 180 100 L 190 100"
        stroke="currentColor"
        stroke-width="6"
        stroke-linecap="round"
        stroke-linejoin="round"
        fill="none"/>
</svg>
