    <!-- Self-hosted critical faces, latin subsets of the variable woff2s.
         Space Grotesk carries the interface text; Bricolage Grotesque draws the
         display title, which is the LCP element on every screen. JetBrains Mono
         is deliberately NOT preloaded — it only sets micro-labels, and it has a
         metrics-matched Courier New fallback, so swapping it costs no shift.
         crossorigin is required for font preloads even same-origin. -->
    <link
      rel="preload"
      href="/fonts/space-grotesk-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/bricolage-grotesque-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <!-- Theme sync script - MUST run before any render to prevent flash.
         Inline, synchronous, not a module and not deferred: it has to finish
         before the browser paints. That is why it duplicates the logic of
         src/lib/theme.ts rather than importing it, and why the preference is
         stored as a bare string — one getItem, no JSON.parse.
         The two hex values mirror THEME_COLOR in src/lib/theme.ts, itself a
         mirror of --background in src/styles/themes.css. -->
    <script>
      (function() {
        try {
          var raw = localStorage.getItem('zoned-theme');
          var pref = (raw === 'light' || raw === 'dark' || raw === 'system') ? raw : 'system';
          var isDark = pref === 'dark' ||
            (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          // toggle, not add: the class may already be there after a bfcache restore.
          document.documentElement.classList.toggle('dark', isDark);
          // Native controls — scrollbars, date pickers, autofill.
          document.documentElement.style.colorScheme = isDark ? 'dark' : 'light';
          var meta = document.querySelector('meta[name="theme-color"]:not([media])');
          if (meta) meta.setAttribute('content', isDark ? '#171614' : '#F6F5F2');
        } catch (e) {
          // Private mode can throw on localStorage. Paint light and carry on.
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>

    <!-- The opening animation preference, read before the shell paints for the
         same reason the theme is: the shell is HTML, it cannot wait for React.
         A SECOND try/catch, not an extension of the one above — that one's
         catch clears the dark class, so a JSON parse failure inside it would
         wipe the theme it had just set. The two failures stay independent.
         `zoned-settings` is JSON (src/hooks/useSettings.tsx), so this one
         parses; on an object this size that costs microseconds, and what
         src/lib/theme.ts calls "load-bearing" is the absence of async and
         imports, not of parsing. -->
    <script>
      (function() {
        try {
          var s = JSON.parse(localStorage.getItem('zoned-settings') || '{}');
          var o = s.openingAnimation;
          document.documentElement.dataset.opening =
            (o === 'always' || o === 'never') ? o : 'system';
        } catch (e) {
          document.documentElement.dataset.opening = 'system';
        }
      })();
    </script>

    <!-- Critical CSS for instant FCP -->
    <style>
      /* The first paint, before any stylesheet loads. Mirrors the paper/ink
         tokens in src/styles/design/colors.css — the shell has to be the same
         cream the app fades into, or the load flashes. */
      :root {
        --bg: #F6F5F2;
        --fg: #171614;
        --primary: #E8452A;
      }
      /* Dark mode via class (applied by script above) */
      .dark {
        --bg: #171614;
        --fg: #EDEBE7;
        --primary: #E8452A;
      }

      /* Initial background */
      body { margin: 0; background: var(--bg); color: var(--fg); }

      /* Base - scoped to loading shell only */
      #loading-shell * { box-sizing: border-box; margin: 0; padding: 0; }

      /* The shell's own copy of the display face. src/styles/design/fonts.css
         declares it too, but that stylesheet arrives with the bundle, after
         this has painted. Same file as the preload above, so no extra request;
         the metrics-matched fallback is the one from fonts.css, so the swap
         moves nothing — the Lighthouse budget holds CLS at exactly 0. */
      @font-face {
        font-family: "Bricolage Grotesque";
        font-weight: 400 800;
        font-display: swap;
        src: url("/fonts/bricolage-grotesque-latin.woff2") format("woff2");
      }
      @font-face {
        font-family: "Bricolage Grotesque Fallback";
        src: local("Arial");
        size-adjust: 112.82%;
        ascent-override: 82.43%;
        descent-override: 23.93%;
        line-gap-override: 0%;
      }

      /* Loading shell — the first image of every launch: the wordmark, and one
         figure running in place on a rule (docs/doodles.md, « le sol est la
         règle de la page »). It replaced the old pulse logo and spinner rather
         than joining them, and the approved duo that stood here for a day left
         the same way: ONE figure per screen, and a drawing replaces, it never
         adds. The duo is untouched everywhere else — the home hero, the mobile
         menu, the share sheet, the Open Graph image.

         The runner is what says the wait is ADVANCING; a still figure said only
         that a wait existed. Recorded in docs/doodles.md under « La coquille
         court » along with what it costs. */
      #loading-shell {
        --accent: var(--primary); /* the duo's soles are stroked in var(--accent) */
        /* --shell-fade lives here, next to --rc-step and --rc-dur below,
           because the shell never sees motion.css: the bundle has not arrived.
           It matches the system's --dur-slow without being able to name it. */
        --shell-fade: 240ms;

        /* An OVERLAY, not a block in the flow. #root precedes it in the DOM and
           carries no CSS of its own, so an in-flow shell held past mount would
           put the app on top and the shell below it. Fixed, the app renders on
           time underneath and the shell simply covers it — which is also what
           keeps the LCP budget intact: nothing about React's mount is delayed,
           only the moment the cover comes off. */
        position: fixed;
        inset: 0;
        z-index: 100;
        background: var(--bg); /* opaque, or the app shows through */
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 40px;
        padding: 0 20px;
        /* `visibility` is what replaces `display: none`, which cannot be
           transitioned: it flips in one discrete step once the fade is over,
           and it takes the shell out of the accessibility tree with it. */
        transition:
          opacity var(--shell-fade) ease-out,
          visibility 0s linear var(--shell-fade);
      }
      .shell-wordmark {
        font-family: "Bricolage Grotesque", "Bricolage Grotesque Fallback", system-ui, sans-serif;
        font-weight: 800;
        font-size: 40px;
        line-height: 1;
        letter-spacing: -0.04em;
        white-space: nowrap;
      }
      .shell-wordmark span { color: var(--primary); }

      /* The rule runs the full width — a horizon — and the figure stands at
         its centre. It was briefly narrowed to hold two drawings side by side;
         with one figure that constraint is gone. */
      .shell-scene {
        position: relative;
        width: 100%;
        display: flex;
        justify-content: center;
        align-items: flex-end;
        padding-bottom: 1.5px;
      }
      /* The rule opens from the CENTRE, which is where the figure stands. At
         t=0 it is a point exactly under the sole, so the contact the vermillon
         marks is real from the first frame; it then runs out to both edges
         while the figure is already running. Drawn from the left instead — as
         it was while the figure waited 400ms for it — the ground would not
         reach the sole until 200ms, and the accent would spend that time
         marking a contact with nothing, which docs/doodles.md forbids. */
      .shell-scene::after {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 1.5px;
        background: var(--fg);
        transform-origin: center;
        animation: shell-rule 240ms ease-out both;
      }
      /* The rule is the ground. The figure's viewBox stops at its soles, so the
         bottom of its box IS the contact line: a negative margin equal to the
         rule's thickness puts that edge on the rule's bottom edge — computed
         from the box, never eyeballed. It paints above the ink rule, so the
         vermillon sole sits on it and not under it.

         174px wide is 240px tall through the viewBox — the top of the range
         docs/doodles.md sanctions for a figure, which is right here: it is
         alone, and the shell is the largest surface in the app. It still fits
         at a 320px viewport without shrinking. */
      .shell-run {
        position: relative;
        z-index: 1;
        display: block;
        inline-size: 174px;
        max-inline-size: 100%;
        block-size: auto;
        aspect-ratio: 218.6 / 301.2; /* the viewBox — an svg with no size collapses */
        margin-bottom: -1.5px;
        color: var(--fg);
      }

      /* The run cycle. A copy of src/styles/components/run-cycle.css, which
         explains the missing fill-mode: with none, each frame falls back to
         its base style, and the base style IS the reduced-motion pose. A
         `forwards` here would leave all six on opacity 0 and the figure would
         VANISH. This copy never sees motion.css — the bundle is not here. */
      .rc {
        --rc-step: 110ms;
        --rc-dur: 660ms;
        --rc-start: 0ms; /* the figure runs from the very first frame */
      }
      .rc-f {
        opacity: 0;
        animation: rc-frame var(--rc-dur) steps(1) infinite;
      }
      .rc-f--1 { opacity: 1; }
      .rc-f--1 { animation-delay: calc(var(--rc-start) + 0 * var(--rc-step)); }
      .rc-f--2 { animation-delay: calc(var(--rc-start) + 1 * var(--rc-step)); }
      .rc-f--3 { animation-delay: calc(var(--rc-start) + 2 * var(--rc-step)); }
      .rc-f--4 { animation-delay: calc(var(--rc-start) + 3 * var(--rc-step)); }
      .rc-f--5 { animation-delay: calc(var(--rc-start) + 4 * var(--rc-step)); }
      .rc-f--6 { animation-delay: calc(var(--rc-start) + 5 * var(--rc-step)); }
      @keyframes rc-frame {
        0%, 16.66% { opacity: 1; }
        16.67%, 100% { opacity: 0; }
      }
      /* Two animations, and only two, and they start TOGETHER at t=0: the
         figure runs — six frames at 110ms — while the ground opens from under
         its sole out to both edges in 240ms. src/main.tsx holds the shell for
         a whole number of strides (SHELL_HOLD_MS), because without a hold the
         app mounts first and the runner never takes a single step.

         Nothing waits for anything: the rule used to draw itself first over
         400ms and the figure only started after, which spent a fifth of the
         opening on a still image. Those two seconds are an OPENING, not a
         report on a real wait — a departure from src/styles/design/motion.css
         written down in docs/doodles.md « La coquille court ». Nothing else
         moves. */
      /* It opens from 2%, not from 0. At exactly scaleX(0) the ground has no
         width at all, and the first painted frame would show the figure with
         its vermillon marking a contact with nothing — one frame, but the rule
         it breaks does not have a tolerance. 2% is ~25px at a laptop width,
         centred under the sole, and reads as the ground starting rather than
         as a tick. */
      @keyframes shell-rule {
        from { transform: scaleX(0.02); }
        to { transform: scaleX(1); }
      }
      /* Under reduced motion the shell is still shown and still held — losing
         the launch screen entirely was never what the setting asks for — but
         the figure freezes on pose 1, its contact pose, and the fade is cut.
         `data-opening="always"` is the one way out, and it is set from a
         preference the person chose in Settings, never inferred by the code. */
      @media (prefers-reduced-motion: reduce) {
        html:not([data-opening="always"]) #loading-shell { transition: none; }
        html:not([data-opening="always"]) .shell-scene::after { animation: none; }
        /* No fill-mode on .rc-f, so every group reverts to its base style:
           frame 1, the front-foot strike, holds. It is the only frozen pose
           with a real ground contact, so its vermillon stays honest. */
        html:not([data-opening="always"]) .rc-f { animation: none; }
      }

      /* The shell leaves once BOTH are true: the app has mounted, and the
         figure has run its strides (src/main.tsx, SHELL_HOLD_MS). `display` is
         untouched: scripts/prerender.ts drops the whole element from every
         prerendered file EXCEPT the root one, which is dist/index.html itself
         — the SPA shell — and there it clears this class instead, so the
         opening survives a prerendered build. */
      #loading-shell.hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none; /* clicks pass through from the first frame */
      }
    </style>
  </head>
  <body>
