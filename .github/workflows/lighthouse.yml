# Performance guardrail: Lighthouse CI on the production build.
#
# Mobile emulation + simulated slow 4G (Lighthouse defaults), median of 3
# runs on the home page and the zones calculator. Budgets live in
# .lighthouserc.json and are calibrated for THIS environment (shared 2-vCPU
# runners are ~3-4x slower than Lighthouse's reference device, and simulated
# throttling multiplies that gap), so they are regression tripwires, not
# real-device targets — track those on PageSpeed Insights / field data.
#
# Calibration (2026-06, median of 3 on ubuntu-latest):
#   FCP ~2.4s -> budget 3.0s | LCP 6.5-7.1s -> 8.5s | TBT 269-927ms -> 1300ms
#   CLS = 0 (blocking, environment-independent)
#   script bytes over the full trace ~740KB -> 850KB (deterministic; catches
#   a heavy dependency leaking into the boot path)
#   perf score: warn only — observed 0.37-0.55 across runs of the SAME
#   commit on shared runners, too noisy to block on.
#
# TBT recalibrated 2026-08 to 1800ms. Medians on main had drifted to 901ms
# (08-01), 961ms (08-07) and 1022ms (08-08), and a docs-only commit measured
# 1475ms. Single runs on identical code ranged 834-2945ms, so 1300ms put the
# tripwire inside the runner's own noise: it fired on a slow afternoon rather
# than on a regression. Recheck the budget whenever the boot path changes.
#
# LCP recalibrated 2026-09 to 10000ms, because the boot path changed: the
# loading shell now holds for one full stride of the run cycle before it fades
# (src/main.tsx, SHELL_HOLD_MS = 1060ms, plus a 240ms fade). It covers the app
# while it holds, so the app's LCP element is only reported once the cover
# comes off — LCP moves by the hold, by construction and on purpose.
#
# Measured on one machine, median of 3, same commit either side:
#   without the hold  LCP 5940ms  |  with the hold  LCP 7357ms  (+1417ms)
# That box runs ~0.6-1.2s faster than the shared runners this budget was set
# from (6.5-7.1s there against 5.9s here), so the projection on CI is 7.9-8.5s
# — at or through the old 8500ms ceiling. 10000ms restores the cushion the
# budget had before (~1.4-2.0s over the observed median).
#
# This is NOT the site getting slower to build: it is the site deliberately
# showing an opening for 1.3s. If that opening is ever dropped or shortened,
# put this budget back — the arithmetic above says where.
name: Lighthouse CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        # VERCEL=1 short-circuits the postinstall puppeteer Chrome download
        # (only needed for the OG-image scripts); Lighthouse uses the
        # runner's preinstalled Chrome.
        run: bun install --frozen-lockfile
        env:
          VERCEL: "1"

      - name: Build production bundle
        run: bun run build

      - name: Run Lighthouse CI
        run: bunx @lhci/cli@0.15.1 autorun

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: lighthouse-reports
          if-no-files-found: ignore
