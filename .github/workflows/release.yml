# Publish a release when main receives a new version.
#
# main only takes release pull requests (scripts/release.sh opens them from
# develop). When one is merged, package.json carries a version that has no tag
# yet: this workflow tags that commit vX.Y.Z, publishes the GitHub Release with
# the CHANGELOG.md section of that version as its notes, then merges main back
# into develop so the release commit (and the merge commit, whatever the merge
# strategy) is in develop's history before the next release.
#
# A push to main whose version is already tagged publishes nothing, and is
# still merged back into develop.
#
# The notes are the CHANGELOG.md section for that version, so the Release and
# the changelog can never drift. No section, no release: an empty release body
# is worse than a loud failure.
#
# workflow_dispatch takes an existing tag so an old tag can be published after
# the fact (the Releases page once sat on v0.4.0 while ten tags had been
# pushed). It does not merge back.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish (e.g. v0.7.3)"
        required: true
        type: string
      make_latest:
        description: "Mark as the latest release (leave off when backfilling old tags)"
        type: boolean
        default: false

permissions:
  contents: write

# Two merges into main in a row must not race on the same tag or on develop.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.sha }}
          fetch-depth: 0

      - name: Resolve the version
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_TAG" ]; then
            echo "name=$INPUT_TAG" >> "$GITHUB_OUTPUT"
            echo "new=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tag="v$(jq -r .version package.json)"
          echo "name=$tag" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "$tag is already tagged: nothing to publish."
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract the changelog section
        if: steps.tag.outputs.new == 'true'
        env:
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          awk -v v="$version" '
            $0 == "## [" v "]" || index($0, "## [" v "] ") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          # Trim leading/trailing blank lines.
          sed -i -e '/./,$!d' release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::No '## [$version]' section found in CHANGELOG.md" >&2
            exit 1
          fi
          echo "--- release notes for $TAG ---"
          cat release-notes.md

      # Creates the tag on this exact commit when it does not exist yet.
      - name: Publish the release
        if: steps.tag.outputs.new == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.tag.outputs.name }}
          body_path: release-notes.md
          # A merged release is genuinely new and takes "Latest". A manual run
          # defaults to not taking it: backfilling old tags one by one
          # otherwise leaves the oldest published release wearing the badge.
          make_latest: ${{ github.event_name == 'push' || inputs.make_latest }}

      # Every push to main, not only a new version: a re-run after a failed
      # back-merge finds the tag already there and must still merge, and a
      # hotfix pushed to main belongs in develop too. Already merged is a no-op.
      # Fast-forward when develop has not moved since the release branch was
      # cut, a merge commit otherwise. That commit is pushed with GITHUB_TOKEN,
      # so by GitHub's rule it starts no CI run; both of its parents were
      # checked already. A conflict (someone edited the same CHANGELOG lines on
      # develop meanwhile) fails here, after the release is out: merge main
      # into develop by hand.
      - name: Merge main back into develop
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch -q origin develop
          git switch -q -c develop origin/develop
          git merge --no-edit "$GITHUB_SHA" -m "chore(release): ramène main (${{ steps.tag.outputs.name }}) dans develop"
          git push origin develop
