<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <link rel="preconnect" href="https://api.fontshare.com">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f%5B%5D=general-sans@400,500,600,700&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap">
  <style>
    /* Zoned Brut, inverted plate. Values mirror `.dark` in
       src/styles/themes.css — the dark ramp, because everything sits on ink. */
    :root {
      --ink: #0b0b0a;
      --paper: #efede6;
      --subtle: #8f8f86;
      --filet: #2a2a26;
      --accent-acid: #d6f24b;

      --zone-1: #8f8f86;
      --zone-2: #6ee07a;
      --zone-3: #f2d53c;
      --zone-4: #ff7a2f;
      --zone-5: #ff3b30;
      --zone-6: #b26bff;

      --font: "General Sans", "Helvetica Neue", system-ui, sans-serif;
      --font-mono: "Space Mono", ui-monospace, monospace;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
      font-family: var(--font);
      background: var(--ink);
      color: var(--paper);
      -webkit-font-smoothing: antialiased;
    }

    .frame {
      width: 1200px;
      height: 630px;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* Zone rule — six flat segments, not a blend. Brut has no gradients:
       "la couleur ne dit qu'une chose : la zone". */
    .zone-bar {
      height: 8px;
      flex-shrink: 0;
      display: grid;
      grid-template-columns: repeat(6, 1fr);
    }

    .zone-bar i:nth-child(1) { background: var(--zone-1); }
    .zone-bar i:nth-child(2) { background: var(--zone-2); }
    .zone-bar i:nth-child(3) { background: var(--zone-3); }
    .zone-bar i:nth-child(4) { background: var(--zone-4); }
    .zone-bar i:nth-child(5) { background: var(--zone-5); }
    .zone-bar i:nth-child(6) { background: var(--zone-6); }

    /* Content */
    .content {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 0 80px;
      gap: 26px;
    }

    /* Logo */
    .logo-row {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    /* "La réglette" — six bars, one per zone. 121x96, so height leads. */
    .logo-row svg {
      width: 45px;
      height: 36px;
      display: block;
    }

    .superheading {
      font-family: var(--font-mono);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--accent-acid);
    }

    .title {
      font-size: 104px;
      font-weight: 700;
      line-height: 0.86;
      letter-spacing: -0.055em;
      text-transform: uppercase;
    }

    .tagline {
      font-size: 28px;
      color: var(--subtle);
      line-height: 1.35;
      max-width: 720px;
      font-weight: 400;
    }

    /* Stats row */
    .stats {
      display: flex;
      align-items: stretch;
      gap: 0;
      margin-top: 8px;
    }

    .stat {
      display: flex;
      align-items: baseline;
      gap: 10px;
      padding: 0 28px;
      border-left: 1px solid var(--filet);
    }

    .stat:first-child { border-left: 0; padding-left: 0; }
    .stat:last-child { padding-right: 0; }

    .stat-number {
      font-size: 34px;
      font-weight: 700;
      letter-spacing: -0.04em;
      color: var(--paper);
    }

    .stat-label {
      font-family: var(--font-mono);
      font-size: 15px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--subtle);
      font-weight: 400;
    }

    .url {
      font-family: var(--font-mono);
      font-size: 17px;
      color: var(--subtle);
      font-weight: 400;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="frame">
    <div class="zone-bar"><i></i><i></i><i></i><i></i><i></i><i></i></div>

    <div class="content">
      <div class="logo-row">
        <svg viewBox="0 0 121 96" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="Zoned">
          <rect x="0" y="65" width="16" height="31" fill="#8f8f86"/>
          <rect x="21" y="0" width="16" height="96" fill="#6ee07a"/>
          <rect x="42" y="52" width="16" height="44" fill="#f2d53c"/>
          <rect x="63" y="29" width="16" height="67" fill="#ff7a2f"/>
          <rect x="84" y="58" width="16" height="38" fill="#ff3b30"/>
          <rect x="105" y="75" width="16" height="21" fill="#b26bff"/>
        </svg>
        <span class="superheading">Zone 1 &rarr; 6</span>
      </div>

      <div class="title">Zoned</div>

      <div class="tagline">Science-based endurance workouts,<br>organized by training zones.</div>

      <div class="stats">
        <div class="stat">
          <span class="stat-number">{{WORKOUT_COUNT}}</span>
          <span class="stat-label">Workouts</span>
        </div>
        <div class="stat">
          <span class="stat-number">{{CALCULATOR_COUNT}}</span>
          <span class="stat-label">Calculators</span>
        </div>
        <div class="stat">
          <span class="stat-number">{{PLAN_COUNT}}</span>
          <span class="stat-label">Plans</span>
        </div>
      </div>

      <div class="url">Start training free &mdash; zoned.run</div>
    </div>

    <div class="zone-bar"><i></i><i></i><i></i><i></i><i></i><i></i></div>
  </div>
</body>
</html>
