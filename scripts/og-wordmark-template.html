<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <link rel="preconnect" href="https://api.fontshare.com">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f%5B%5D=general-sans@400,500,600,700&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap">
  <style>
    :root {
      --w: {{W}}px;
      --h: {{H}}px;
      --px-x: {{PX_X}}px;
      --px-y: {{PX_Y}}px;
      --wordmark-size: {{WORDMARK_SIZE}}px;
      --fs: {{FS}}px;
      --sub: {{SUB}}px;
      --bullet-num-fs: {{BULLET_NUM_FS}}px;
      --bullet-fs: {{BULLET_FS}}px;
      --url-fs: {{URL_FS}}px;
      --meta-fs: {{META_FS}}px;

      /* Zoned Brut primitives — mirrors src/styles/themes.css `:root`. */
      --paper: #efede6;
      --card: #fcfbf6;
      --ink: #0b0b0a;
      --muted: #3b3a33;
      --subtle: #5b594f;
      --filet: #cfccc0;
      --accent-acid: #d6f24b;

      --font: "General Sans", "Helvetica Neue", system-ui, sans-serif;
      --font-mono: "Space Mono", ui-monospace, monospace;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: var(--w);
      height: var(--h);
      overflow: hidden;
      background: var(--paper);
    }

    body {
      font-family: var(--font);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
    }

    /* Flat ink-on-paper. No gradient, no glow: everything here must survive
       being printed in one colour. */
    .card {
      width: var(--w);
      height: var(--h);
      padding: var(--px-y) var(--px-x);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      background: var(--paper);
    }

    /* Top eyebrow */
    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .wordmark {
      display: inline-flex;
      align-items: center;
      gap: calc(var(--wordmark-size) * 0.3);
      font-size: var(--wordmark-size);
      font-weight: 700;
      letter-spacing: -0.045em;
      text-transform: uppercase;
      line-height: 1;
    }

    /* "La réglette" — six bars, one per zone. 121x96, so height leads. */
    .wordmark svg {
      height: calc(var(--wordmark-size) * 1.25);
      width: calc(var(--wordmark-size) * 1.575);
      display: block;
    }

    /* Big headline block */
    .headline-block {
      margin-top: auto;
    }

    h1.headline {
      font-size: var(--fs);
      font-weight: 700;
      line-height: 0.92;
      letter-spacing: -0.05em;
      text-transform: uppercase;
      color: var(--ink);
    }

    /* The one accent per card: an acid marker stroke behind the word, not a
       second text colour (Brut reserves colour for zones). */
    h1.headline em {
      font-style: normal;
      font-weight: 700;
      position: relative;
      z-index: 0;
      padding: 0 0.06em;
    }

    h1.headline em::before {
      content: "";
      position: absolute;
      left: -0.02em;
      right: -0.03em;
      top: 0.1em;
      bottom: 0.04em;
      z-index: -1;
      background: var(--accent-acid);
      transform: rotate(-1deg);
    }

    p.subline {
      margin-top: 28px;
      font-size: var(--sub);
      font-weight: 400;
      line-height: 1.4;
      color: var(--muted);
      max-width: calc(var(--w) * 0.72);
    }

    /* Bullets */
    .bullets {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 28px;
      margin-top: var(--bullets-mt, 48px);
    }

    .bullet {
      border-top: 2px solid var(--ink);
      padding-top: 18px;
    }

    .bullet .b-num {
      font-family: var(--font-mono);
      font-size: var(--bullet-num-fs);
      font-weight: 700;
      letter-spacing: 0.2em;
      color: var(--subtle);
      margin-bottom: 10px;
    }

    .bullet .b-value {
      font-size: var(--bullet-fs);
      font-weight: 700;
      line-height: 1.05;
      letter-spacing: -0.04em;
      color: var(--ink);
      margin-bottom: 4px;
    }

    .bullet .b-label {
      font-family: var(--font-mono);
      font-size: var(--bullet-num-fs);
      font-weight: 400;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--subtle);
    }

    /* Footer */
    .footer {
      margin-top: auto;
      padding-top: 28px;
      border-top: 2px solid var(--ink);
      text-align: center;
      font-family: var(--font-mono);
      font-size: var(--meta-fs);
      font-weight: 400;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--subtle);
      line-height: 1.4;
    }

    .footer b {
      color: var(--ink);
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="top">
      <div class="wordmark">
        <svg viewBox="0 0 121 96" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="Zoned">
          <rect x="0" y="65" width="16" height="31" fill="#8f8f86"/>
          <rect x="21" y="0" width="16" height="96" fill="#2fa84a"/>
          <rect x="42" y="52" width="16" height="44" fill="#e0b400"/>
          <rect x="63" y="29" width="16" height="67" fill="#ff6a1f"/>
          <rect x="84" y="58" width="16" height="38" fill="#e5261b"/>
          <rect x="105" y="75" width="16" height="21" fill="#8a46e0"/>
        </svg>
        <span>Zoned</span>
      </div>
    </div>

    <div class="headline-block">
      <h1 class="headline">{{HEADLINE}}</h1>
      <p class="subline">{{SUBLINE}}</p>
    </div>

    <div class="bullets">
      <div class="bullet">
        <div class="b-num">01</div>
        <div class="b-value">{{B1_VALUE}}</div>
        <div class="b-label">{{B1_LABEL}}</div>
      </div>
      <div class="bullet">
        <div class="b-num">02</div>
        <div class="b-value">{{B2_VALUE}}</div>
        <div class="b-label">{{B2_LABEL}}</div>
      </div>
      <div class="bullet">
        <div class="b-num">03</div>
        <div class="b-value">{{B3_VALUE}}</div>
        <div class="b-label">{{B3_LABEL}}</div>
      </div>
    </div>

    <div class="footer">
      {{FOOTER}}
    </div>
  </div>
</body>
</html>
