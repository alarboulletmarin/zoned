<!DOCTYPE html>
<html lang="en" class="{{THEME}}">
<head>
  <meta charset="UTF-8" />
  <style>
    /* Paper, ink, one accent — the tokens of src/styles/design/colors.css, and
       the three faces of src/styles/design/fonts.css embedded as data URIs so
       the headless page needs neither a server nor the network. Do not
       recompute the values: they are copies, and the app is the source. */
    @font-face { font-family: "Bricolage Grotesque"; font-weight: 400 800; src: url("{{FONT_DISPLAY}}") format("woff2"); }
    @font-face { font-family: "Space Grotesk"; font-weight: 300 700; src: url("{{FONT_TEXT}}") format("woff2"); }
    @font-face { font-family: "JetBrains Mono"; font-weight: 400 700; src: url("{{FONT_MONO}}") format("woff2"); }

    :root {
      --w: {{W}}px;
      --h: {{H}}px;
      --px-x: {{PX_X}}px;
      --px-top: {{PX_TOP}}px;
      --px-bottom: {{PX_BOTTOM}}px;
      --wordmark-fs: {{WORDMARK_FS}}px;
      --lede-fs: {{LEDE_FS}}px;
      --lede-max: {{LEDE_MAX}}ch;
      --value-fs: {{VALUE_FS}}px;
      --label-fs: {{LABEL_FS}}px;
      --meta-fs: {{META_FS}}px;
      --stat-gap: {{STAT_GAP}}px;
      --duo-w: {{DUO_W}}px;
      --rule: {{RULE}}px;

      --paper-page: #F6F5F2;
      --ink-1: #171614;
      --ink-2: #4A4845;
      --ink-3: #6C6A65;
      --accent: #E8452A;

      --font-display: "Bricolage Grotesque", system-ui, sans-serif;
      --font-text: "Space Grotesk", system-ui, sans-serif;
      --font-mono: "JetBrains Mono", ui-monospace, monospace;
    }
    .dark {
      --paper-page: #171614;
      --ink-1: #EDEBE7;
      --ink-2: #C2BFB9;
      --ink-3: #918E88;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: var(--w);
      height: var(--h);
      overflow: hidden;
      background: var(--paper-page);
    }
    body {
      font-family: var(--font-text);
      color: var(--ink-1);
      -webkit-font-smoothing: antialiased;
    }

    .card {
      width: var(--w);
      height: var(--h);
      padding: var(--px-top) var(--px-x) var(--px-bottom);
      display: flex;
      flex-direction: column;
    }

    /* The stage: the copy on the left, the duo on the right, both standing on
       the one rule — the stage's bottom border. The figure's viewBox ends at
       its soles, so a negative margin equal to the rule seats them on it
       (docs/doodles.md, « le sol est la règle de la page »); the figure is
       positioned so its vermillon soles paint above the ink rule. */
    .stage {
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 40px;
      border-bottom: var(--rule) solid var(--ink-1);
    }
    .copy {
      align-self: stretch;
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
    }

    .wordmark {
      font: 800 var(--wordmark-fs) / 1 var(--font-display);
      letter-spacing: -0.04em;
      white-space: nowrap;
    }
    .wordmark span { color: var(--accent); }

    .lede {
      margin-top: calc(var(--lede-fs) * 0.6);
      font: 500 var(--lede-fs) / 1.3 var(--font-text);
      color: var(--ink-2);
      max-width: var(--lede-max);
      text-wrap: balance;
    }

    /* The three numbers sit on the rule like the figure does. */
    .stats {
      margin-top: auto;
      display: flex;
      gap: var(--stat-gap);
      padding-bottom: calc(var(--value-fs) * 0.3);
    }
    .value {
      font: 700 var(--value-fs) / 1 var(--font-mono);
      letter-spacing: -0.02em;
      white-space: nowrap;
    }
    .label {
      margin-top: calc(var(--label-fs) * 0.7);
      font: 500 var(--label-fs) / 1.3 var(--font-mono);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--ink-3);
      white-space: nowrap;
    }

    .duo {
      flex: none;
      position: relative;
      z-index: 1;
      margin-bottom: calc(-1 * var(--rule));
      color: var(--ink-1);
    }
    .duo svg {
      display: block;
      width: var(--duo-w);
      height: auto;
    }

    .footer {
      display: flex;
      justify-content: space-between;
      margin-top: calc(var(--meta-fs) * 1.1);
      font: 500 var(--meta-fs) / 1.3 var(--font-mono);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--ink-3);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="stage">
      <div class="copy">
        <div class="wordmark">zoned<span>.</span></div>
        <p class="lede">{{LEDE}}</p>
        <div class="stats">
          <div>
            <div class="value">{{S1_VALUE}}</div>
            <div class="label">{{S1_LABEL}}</div>
          </div>
          <div>
            <div class="value">{{S2_VALUE}}</div>
            <div class="label">{{S2_LABEL}}</div>
          </div>
          <div>
            <div class="value">{{S3_VALUE}}</div>
            <div class="label">{{S3_LABEL}}</div>
          </div>
        </div>
      </div>
      <div class="duo">{{DUO}}</div>
    </div>
    <div class="footer">
      <span>zoned.run</span>
      <span>{{FOOTER}}</span>
    </div>
  </div>
</body>
</html>
